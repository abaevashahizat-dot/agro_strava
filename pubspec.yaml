name: agro_strava
description: "AgroStrava - Field inspection and tracking mobile application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Пакеты для интерактивной карты и GPS-трекинга
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0

  # Пакет для локального сохранения учетных записей и оффлайн-журнала
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Пакет для автоматической публикации на GitHub Pages (исправленная версия)
  gh_pages: ^0.1.1

flutter:
  uses-material-design: true